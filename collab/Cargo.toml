[package]
name = "tpt-vertex-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Real-time collaboration for TPT Vertex via CRDTs over feature trees, with presence and merge semantics."

[dependencies]
tpt-vertex-kernel = { path = "../tpt-vertex-kernel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

# Browser/WASM build (same pattern as tpt-vertex-kernel).
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# Native WebSocket sync server (`src/bin/sync_server.rs`). Optional so the
# library half stays buildable for wasm32, where tokio/native-tls do not apply.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
], optional = true }
tokio-tungstenite = { version = "0.30", features = ["native-tls"], optional = true }
futures-util = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }

[features]
default = ["server"]
# Native WebSocket adapter around the transport-agnostic `SyncHub`.
server = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:anyhow"]
# Browser/WASM build (CRDT + presence in the browser via wasm-bindgen).
# Also switches the kernel dependency to its own `wasm` feature so the whole
# graph builds for wasm32-unknown-unknown.
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook", "tpt-vertex-kernel/wasm"]

[dev-dependencies]

[lib]
name = "tpt_vertex_collab"
path = "src/lib.rs"

# WebSocket sync server: `cargo run -p tpt-vertex-collab --bin sync_server`.
[[bin]]
name = "sync_server"
path = "src/bin/sync_server.rs"
required-features = ["server"]
