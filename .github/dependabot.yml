# Dependabot keeps the Rust workspace and both JS packages up to date.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  # Rust workspace (root Cargo.toml / Cargo.lock)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(cargo)"

  # Web frontend
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(frontend)"

  # Tauri desktop client
  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(desktop)"
